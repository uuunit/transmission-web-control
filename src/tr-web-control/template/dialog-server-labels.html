<div class="easyui-layout" data-options="fit:true" style="width:100%;height:100%;">
	<div data-options="region:'north',border:false" style="padding:6px 8px;border-bottom:1px solid #ccc;">
		<span system-lang="dialog['server-labels']['new-label']"></span>
		<input id="server-label-new" class="easyui-textbox" style="width:180px;"/>
		<a id="server-label-add" class="easyui-linkbutton" data-options="iconCls:'icon-add',plain:true" href="javascript:void(0);" system-lang="dialog['public']['button-addnew']"></a>
	</div>
	<div data-options="region:'center'" style="padding:8px;overflow:auto;">
		<div style="margin-bottom:4px;font-weight:bold;" system-lang="dialog['server-labels']['selected']"></div>
		<div id="server-label-selected" style="min-height:40px;padding:4px;border:1px dashed #ccc;margin-bottom:10px;"></div>

		<div style="margin-bottom:4px;font-weight:bold;" system-lang="dialog['server-labels']['suggestions']"></div>
		<div id="server-label-suggestions"></div>
	</div>
	<div data-options="region:'south',border:false" style="text-align:right;padding:6px;">
		<span id="server-label-count" style="float:left;color:#999;"></span>
		<a id="server-label-button-ok" class="easyui-linkbutton" data-options="iconCls:'icon-ok',plain:true" href="javascript:void(0);" system-lang="dialog['public']['button-ok']">Ok</a>
		<a id="server-label-button-cancel" class="easyui-linkbutton" data-options="iconCls:'icon-cancel',plain:true" href="javascript:void(0);" system-lang="dialog['public']['button-cancel']">Cancel</a>
	</div>
</div>
